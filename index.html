<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pysäkkitaulut">
<meta name="theme-color" content="#00694A">
<title>Pysäkkitaulut</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --ink:#13201A; --muted:#5B6B63;
  --green:#00694A; --green-ink:#FFFFFF; --yellow:#FFD23F; --line:#D5DDD8; --warn:#B3261E;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Condensed","Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ color-scheme:dark;
    --bg:#0D1411; --surface:#16201B; --ink:#E9EFEB; --muted:#93A39B;
    --green:#1F8A66; --green-ink:#FFFFFF; --yellow:#FFD23F; --line:#27342D; --warn:#FF8A80; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:0 16px 40px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
[hidden]{display:none!important}
.m-TRAM{--mc:var(--green)}.m-BUS{--mc:#007AC9}.m-SUBWAY{--mc:#CA4000}.m-RAIL{--mc:#8C4799}.m-FERRY{--mc:#007A97}

.top{display:flex;align-items:center;gap:12px;padding:18px 0 14px}
.top h1{font-family:var(--cond);font-weight:700;font-size:30px;line-height:1.05;margin:0;flex:1;letter-spacing:.2px}
.top small{display:block;font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted);letter-spacing:0}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.plain{border-color:transparent;background:transparent;padding:10px 8px}
.btn[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:#13201A}

/* Suosikit ja hakutulokset */
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{display:block;width:100%;text-align:left;background:var(--surface);border:0;border-left:6px solid var(--mc,var(--green));
  border-radius:4px 12px 12px 4px;padding:12px 14px}
.item .name{font-family:var(--cond);font-weight:700;font-size:24px;line-height:1.1}
.item .meta{color:var(--muted);font-size:15px}
.item .next{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-weight:600}
.item .next b{font-family:var(--cond);font-size:20px}
.empty{color:var(--muted);padding:20px 2px}

/* Linjatunnus */
.ln{display:inline-grid;place-items:center;min-width:2.1em;height:1.5em;padding:0 .3em;border-radius:6px;
  background:var(--mc,var(--green));color:var(--green-ink);font-family:var(--cond);font-weight:700}

/* Linjavalinnat */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:40px;
  font-family:var(--cond);font-weight:700;font-size:20px}
.chip[aria-pressed="true"]{background:var(--mc,var(--green));border-color:var(--mc,var(--green));color:var(--green-ink)}

/* Taulu */
.board{background:var(--surface);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding:16px 14px}
.row .ln{font-size:24px}
.row .to{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .min{font-family:var(--cond);font-weight:700;font-size:30px;line-height:1;text-align:right;white-space:nowrap}
.row .min span{font-size:17px;font-weight:600;margin-left:3px}
.row:first-child .ln{font-size:34px}
.row:first-child .to{font-size:20px}
.row:first-child .min{font-size:58px;background:var(--yellow);color:#13201A;border-radius:10px;padding:4px 12px}
.row.sched .min{color:var(--muted)}
.row:first-child.sched .min{background:var(--line);color:var(--ink)}
.row.cancel .min{font-size:20px;color:var(--warn);background:none}
.note{color:var(--muted);font-size:14px;margin:8px 2px 0}

#map{height:260px;border-radius:14px;margin-top:14px;background:var(--line);z-index:0}
.veh{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--mc,var(--green));color:#fff;
  border:2px solid #fff;font-family:var(--cond);font-weight:700;font-size:16px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .btn{flex:1}

.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
.msg{background:var(--surface);border-left:6px solid var(--yellow);border-radius:4px 12px 12px 4px;padding:12px 14px;margin:0 0 14px}
.msg p{margin:0 0 8px}
.msg a{color:inherit}
.langs{display:flex;gap:8px;margin-top:24px}
.langs .btn{min-height:40px;padding:6px 14px;font-size:15px}
#favs-empty.note{margin-top:16px}
</style>
</head>
<body>
<main>

  <!-- Avain puuttuu -->
  <div class="msg" id="keybox" hidden>
    <p id="k-p"></p>
    <div class="search">
      <input id="keyinput" placeholder="Liitä avain tähän" autocomplete="off" aria-label="Digitransit-avain">
      <button class="btn primary" id="keysave">Tallenna avain</button>
    </div>
  </div>
  <div class="msg" id="errbox" hidden></div>

  <!-- Etusivu: suosikit -->
  <section id="v-home" hidden>
    <div class="top">
      <h1>Pysäkkitaulut</h1>
      <button class="btn primary" id="go-search">Lisää pysäkki</button>
    </div>
    <ul class="list" id="favs"></ul>
    <p class="empty" id="favs-empty"></p>
    <div class="langs" id="langs" role="group" aria-label="Kieli, språk, language"></div>
  </section>

  <!-- Haku -->
  <section id="v-search" hidden>
    <div class="top">
      <button class="btn plain" id="back1" data-home aria-label="Takaisin">‹ Takaisin</button>
      <h1 id="search-h">Hae pysäkki</h1>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Pysäkin tai aseman nimi" autocomplete="off" aria-label="Pysäkin nimi">
      <button class="btn" id="near">Lähellä</button>
    </div>
    <div class="chips" id="modes" role="group" aria-label="Kulkuneuvo"></div>
    <ul class="list" id="results"></ul>
    <p class="empty" id="results-empty" hidden></p>
  </section>

  <!-- Pysäkki -->
  <section id="v-stop" hidden>
    <div class="top">
      <button class="btn plain" data-home aria-label="Takaisin">‹</button>
      <h1 id="s-name">&nbsp;<small id="s-meta"></small></h1>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Näytettävät linjat"></div>
    <div class="board" id="board" aria-live="polite"></div>
    <p class="note" id="s-note"></p>
    <div id="map" aria-label="Ratikoiden sijainnit kartalla"></div>
    <div class="actions">
      <button class="btn" id="fav" aria-pressed="false">Tallenna suosikiksi</button>
      <button class="btn" id="share">Jaa linkki</button>
    </div>
  </section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
/* ---------- Asetukset ---------- */
const CONFIG = {
  API_URL: "https://api.digitransit.fi/routing/v2/hsl/gtfs/v1",
  API_KEY: "",        // Liitä Digitransit-avain tähän, niin käyttäjiltä ei kysytä sitä.
  PROXY_URL: "https://ratikka.mikko-p-karkkainen.workers.dev",      // Jos käytössä on oma välityspalvelin (esim. Cloudflare Worker), sen osoite. Avain jää silloin palvelimelle.
  HFP_URL: "wss://mqtt.hsl.fi:443/",
  POLL_MS: 15000
};

/* ---------- Apurit ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const byLine = (a, b) => (parseInt(a) - parseInt(b)) || String(a).localeCompare(String(b));
let favs = store.get("ratikka.favs", []);
const favKey = f => f.id + "|" + [...(f.lines || [])].sort(byLine).join(",");
/* ---------- Kielet ---------- */
const DEV = 'href="https://digitransit.fi/en/developers/" target="_blank" rel="noopener"';
const TXT = {
  fi: {
    keyHtml: `<strong>Tarvitaan Digitransit-avain.</strong> Ilmaisen avaimen saa rekisteröitymällä <a ${DEV}>Digitransitin kehittäjäsivuilla</a>.`,
    keyPh: "Liitä avain tähän", keySave: "Tallenna avain", addStop: "Lisää pysäkki",
    emptyFavs: "Ei vielä pysäkkejä. Paina Lisää pysäkki, hae pysäkki ja valitse linjat. Paina sitten Tallenna suosikiksi, niin taulu pysyy tässä laitteessa muistissa.",
    hint: "Uusi taulu: paina Lisää pysäkki, valitse linjat ja paina Tallenna suosikiksi. Samasta pysäkistä voi tallentaa useita tauluja eri linjoilla.",
    back: "Takaisin", searchTitle: "Hae pysäkki", searchPh: "Pysäkin tai aseman nimi", near: "Lähellä",
    modeAria: "Kulkuneuvo", linesAria: "Näytettävät linjat", mapAria: "Ajoneuvojen sijainnit kartalla",
    favSave: "Tallenna suosikiksi", favOn: "Suosikeissa – poista", share: "Jaa linkki", copied: "Linkki kopioitu",
    errNet: "Ei yhteyttä. Tarkista verkko, tiedot päivittyvät kun yhteys palaa.",
    errKey: "Avain ei kelpaa. Tarkista se ja tallenna uudelleen.",
    errHttp: "Aikataulupalvelu ei vastaa (virhe {n}). Yritetään pian uudelleen.", errGql: "Haku epäonnistui: ",
    cancelled: "peruttu", now: "nyt", lines: "linjat", allLines: "kaikki linjat", noDeps: "Ei lähtöjä juuri nyt",
    modes: {TRAM: "Ratikka", BUS: "Bussi", SUBWAY: "Metro", RAIL: "Juna", FERRY: "Lautta"},
    noHitsMode: "Ei osumia kulkuneuvolle {m}. Vaihda kulkuneuvoa yltä tai kokeile toista nimeä.", noHits: "Ei osumia. Kokeile nimen alkua.",
    platform: "laituri", toward: "Suuntaan",
    errNoGeo: "Tämä selain ei tue paikannusta. Hae pysäkki nimellä.",
    errGeo: "Paikannus ei onnistunut. Salli sijainti selaimen asetuksista tai hae nimellä.",
    loading: "Haetaan…", notFound: "Pysäkkiä ei löytynyt", noUpcoming: "Ei tulevia lähtöjä valituilla linjoilla.",
    schedNote: "~ tarkoittaa aikataulun mukaista aikaa, ajoneuvosta ei ole vielä seurantatietoa."
  },
  sv: {
    keyHtml: `<strong>En Digitransit-nyckel behövs.</strong> En gratis nyckel får du genom att registrera dig på <a ${DEV}>Digitransits utvecklarsidor</a>.`,
    keyPh: "Klistra in nyckeln här", keySave: "Spara nyckeln", addStop: "Lägg till hållplats",
    emptyFavs: "Inga hållplatser ännu. Tryck på Lägg till hållplats, sök en hållplats och välj linjer. Tryck sedan på Spara som favorit, så finns tavlan kvar på den här enheten.",
    hint: "Ny tavla: tryck på Lägg till hållplats, välj linjer och tryck på Spara som favorit. Du kan spara flera tavlor för samma hållplats med olika linjer.",
    back: "Tillbaka", searchTitle: "Sök hållplats", searchPh: "Hållplatsens eller stationens namn", near: "Nära mig",
    modeAria: "Färdmedel", linesAria: "Linjer som visas", mapAria: "Fordonens position på kartan",
    favSave: "Spara som favorit", favOn: "Favorit – ta bort", share: "Dela länk", copied: "Länken kopierad",
    errNet: "Ingen anslutning. Kontrollera nätet, uppgifterna uppdateras när anslutningen är tillbaka.",
    errKey: "Nyckeln är ogiltig. Kontrollera den och spara på nytt.",
    errHttp: "Tidtabellstjänsten svarar inte (fel {n}). Vi försöker snart igen.", errGql: "Sökningen misslyckades: ",
    cancelled: "inställd", now: "nu", lines: "linjer", allLines: "alla linjer", noDeps: "Inga avgångar just nu",
    modes: {TRAM: "Spårvagn", BUS: "Buss", SUBWAY: "Metro", RAIL: "Tåg", FERRY: "Färja"},
    noHitsMode: "Inga träffar för färdmedlet {m}. Byt färdmedel ovan eller prova ett annat namn.", noHits: "Inga träffar. Prova början av namnet.",
    platform: "plattform", toward: "Mot",
    errNoGeo: "Den här webbläsaren stöder inte positionering. Sök hållplatsen med namn.",
    errGeo: "Positioneringen misslyckades. Tillåt platsåtkomst i webbläsarens inställningar eller sök med namn.",
    loading: "Söker…", notFound: "Hållplatsen hittades inte", noUpcoming: "Inga kommande avgångar för de valda linjerna.",
    schedNote: "~ betyder tid enligt tidtabell, fordonet har ännu ingen realtidsuppföljning."
  },
  en: {
    keyHtml: `<strong>A Digitransit key is needed.</strong> You can get a free key by registering on the <a ${DEV}>Digitransit developer pages</a>.`,
    keyPh: "Paste the key here", keySave: "Save key", addStop: "Add stop",
    emptyFavs: "No stops yet. Tap Add stop, search for a stop and choose the lines. Then tap Save as favourite and the board stays on this device.",
    hint: "New board: tap Add stop, choose the lines and tap Save as favourite. You can save several boards for the same stop with different lines.",
    back: "Back", searchTitle: "Find a stop", searchPh: "Stop or station name", near: "Nearby",
    modeAria: "Vehicle type", linesAria: "Lines shown", mapAria: "Vehicle positions on the map",
    favSave: "Save as favourite", favOn: "Saved – remove", share: "Share link", copied: "Link copied",
    errNet: "No connection. Check your network; times update when the connection returns.",
    errKey: "The key is not valid. Check it and save again.",
    errHttp: "The timetable service is not responding (error {n}). Trying again soon.", errGql: "Search failed: ",
    cancelled: "cancelled", now: "now", lines: "lines", allLines: "all lines", noDeps: "No departures right now",
    modes: {TRAM: "Tram", BUS: "Bus", SUBWAY: "Metro", RAIL: "Train", FERRY: "Ferry"},
    noHitsMode: "No results for {m}. Change the vehicle type above or try another name.", noHits: "No results. Try the start of the name.",
    platform: "platform", toward: "Towards",
    errNoGeo: "This browser does not support location. Search for the stop by name.",
    errGeo: "Could not get your location. Allow location in the browser settings or search by name.",
    loading: "Loading…", notFound: "Stop not found", noUpcoming: "No upcoming departures for the selected lines.",
    schedNote: "~ means a scheduled time; the vehicle has no live tracking yet."
  }
};
const navLang = (navigator.language || "fi").toLowerCase();
let lang = store.get("ratikka.lang", null) || (navLang.startsWith("fi") ? "fi" : navLang.startsWith("sv") ? "sv" : "en");
if(!TXT[lang]) lang = "fi";
const tr = k => TXT[lang][k];
function applyLang(){
  document.documentElement.lang = lang;
  $("k-p").innerHTML = tr("keyHtml");
  $("keyinput").placeholder = tr("keyPh"); $("keysave").textContent = tr("keySave");
  $("go-search").textContent = tr("addStop");
  $("back1").textContent = "‹ " + tr("back");
  document.querySelectorAll("[data-home]").forEach(b => b.setAttribute("aria-label", tr("back")));
  $("search-h").textContent = tr("searchTitle");
  $("q").placeholder = tr("searchPh"); $("q").setAttribute("aria-label", tr("searchPh"));
  $("near").textContent = tr("near");
  $("modes").setAttribute("aria-label", tr("modeAria")); $("chips").setAttribute("aria-label", tr("linesAria"));
  $("map").setAttribute("aria-label", tr("mapAria"));
  $("share").textContent = tr("share");
  $("langs").innerHTML = ["fi", "sv", "en"].map(l =>
    `<button class="btn" data-lang="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join("");
}
$("langs").addEventListener("click", e => {
  const b = e.target.closest("[data-lang]"); if(!b) return;
  lang = b.dataset.lang; store.set("ratikka.lang", lang);
  homeNames = {}; applyLang(); renderModes(); route();
});
let timers = [];
const every = (fn, ms) => timers.push(setInterval(fn, ms));
function showErr(text){ const b = $("errbox"); b.hidden = !text; b.textContent = text || ""; }

/* ---------- Digitransit ---------- */
function apiKey(){ return CONFIG.API_KEY || store.get("ratikka.key", ""); }
async function gql(query, variables){
  const headers = {"Content-Type":"application/json"};
  if(!CONFIG.PROXY_URL){
    if(!apiKey()){ $("keybox").hidden = false; throw new Error("nokey"); }
    headers["digitransit-subscription-key"] = apiKey();
  }
  let res;
  try{
    res = await fetch(CONFIG.PROXY_URL || CONFIG.API_URL, {method:"POST", headers, body:JSON.stringify({query, variables})});
  }catch(e){ showErr(tr("errNet")); throw e; }
  if(res.status === 401 || res.status === 403){
    $("keybox").hidden = false; showErr(tr("errKey")); throw new Error("auth");
  }
  if(!res.ok){ showErr(tr("errHttp").replace("{n}", res.status)); throw new Error("http"); }
  const json = await res.json();
  if(json.errors && !json.data){
    if(!transOff && /language/i.test(json.errors[0].message || "")) transOff = true;  // rajapinta ei tue käännöksiä: seuraava haku tehdään ilman
    showErr(tr("errGql") + json.errors[0].message); throw new Error("gql");
  }
  showErr(""); $("keybox").hidden = true;
  return json.data;
}
// Nimet ja määränpäät pyydetään käyttöliittymän kielellä (HSL:n datassa on ruotsin- ja englanninkieliset käännökset).
let transOff = false;
const LA = () => (lang === "fi" || transOff) ? "" : `(language: "${lang}")`;
const TIMES = () => `stoptimesWithoutPatterns(numberOfDepartures: 30){
  serviceDay scheduledArrival realtimeArrival realtime realtimeState headsign${LA()}
  trip{ directionId route{ gtfsId shortName mode } } }`;
const STOP_FIELDS = () => `gtfsId name${LA()} code platformCode vehicleMode routes{ shortName mode } patterns{ headsign }`;

/* ---------- Ajat ---------- */
function eta(t){
  const sec = t.serviceDay + t.realtimeArrival - Date.now()/1000;
  if(t.realtimeState === "CANCELED") return {html: tr("cancelled"), cancel:true, sec};
  const pre = t.realtime ? "" : "~";
  if(sec < 45) return {html: tr("now"), sec};
  if(sec < 3600) return {html: pre + Math.floor(sec/60) + "<span>min</span>", sec};
  const d = new Date((t.serviceDay + t.realtimeArrival) * 1000);
  return {html: pre + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"), sec};
}
function upcoming(times, lines){
  return (times || [])
    .filter(t => !lines.length || lines.includes(t.trip.route.shortName))
    .map(t => ({t, e: eta(t)}))
    .filter(x => x.e.sec > -20)
    .sort((a, b) => a.e.sec - b.e.sec);
}

/* ---------- Reititys ---------- */
function stopHash(id, lines){ return "p=" + id + (lines && lines.length ? "&l=" + lines.join(",") : ""); }
function route(){
  timers.forEach(clearInterval); timers = [];
  stopLive();
  const h = decodeURIComponent(location.hash.slice(1));
  ["v-home","v-search","v-stop"].forEach(v => $(v).hidden = true);
  if(h.startsWith("p=")){
    const p = new URLSearchParams(h);
    openStop(p.get("p"), (p.get("l") || "").split(",").filter(Boolean));
  }else if(h === "haku"){ $("v-search").hidden = false; $("q").focus(); }
  else openHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
document.querySelectorAll("[data-home]").forEach(b => b.onclick = () => { location.hash = ""; });
$("go-search").onclick = () => { location.hash = "haku"; };
$("keysave").onclick = () => { const v = $("keyinput").value.trim(); if(v){ store.set("ratikka.key", v); $("keybox").hidden = true; route(); } };

/* ---------- Etusivu ---------- */
let homeData = {}, homeNames = {};
function openHome(){
  $("v-home").hidden = false;
  renderHome();
  if(!favs.length) return;
  const load = async () => {
    const q = "{" + favs.map((f, i) => `s${i}: stop(id: ${JSON.stringify(f.id)}){ ...T }`).join(" ") + `} fragment T on Stop { name${LA()} ${TIMES()} }`;
    try{ const d = await gql(q); favs.forEach((f, i) => { const st = d["s" + i]; homeData[f.id] = st ? st.stoptimesWithoutPatterns : []; if(st) homeNames[f.id] = st.name; }); renderHome(); }catch(e){}
  };
  load(); every(load, CONFIG.POLL_MS); every(renderHome, 5000);
}
function renderHome(){
  $("favs-empty").className = favs.length ? "note" : "empty";
  $("favs-empty").textContent = tr(favs.length ? "hint" : "emptyFavs");
  $("favs").innerHTML = favs.map(f => {
    const next = upcoming(homeData[f.id], f.lines).filter(x => !x.e.cancel).slice(0, 3);
    return `<li><button class="item m-${esc(f.mode || "TRAM")}" data-go="${esc(stopHash(f.id, f.lines))}">
      <div class="name">${esc(homeNames[f.id] || f.name)}</div>
      <div class="meta">${esc(f.code || "")}${f.lines.length ? ", " + tr("lines") + " " + esc(f.lines.join(", ")) : ", " + tr("allLines")}</div>
      <div class="next">${next.length ? next.map(x => `<span><span class="ln m-${esc(x.t.trip.route.mode)}">${esc(x.t.trip.route.shortName)}</span> <b>${x.e.html.replace("<span>min</span>", " min")}</b></span>`).join("") : '<span class="meta">' + tr("noDeps") + '</span>'}</div>
    </button></li>`;
  }).join("");
}
document.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if(b) location.hash = b.dataset.go; });

/* ---------- Haku ---------- */
const MODES = ["TRAM", "BUS", "SUBWAY", "RAIL", "FERRY"];
let mode = store.get("ratikka.mode", "TRAM");
let found = null;
function renderModes(){
  $("modes").innerHTML = MODES.map(m =>
    `<button class="chip m-${m}" data-mode="${m}" aria-pressed="${m === mode}">${tr("modes")[m]}</button>`).join("");
}
$("modes").addEventListener("click", e => {
  const b = e.target.closest("[data-mode]"); if(!b) return;
  mode = b.dataset.mode; store.set("ratikka.mode", mode); renderModes(); renderResults();
});
renderModes();
function renderResults(){
  if(!found){ $("results").innerHTML = ""; $("results-empty").hidden = true; return; }
  const list = found.filter(s => s.vehicleMode === mode);
  const label = tr("modes")[mode].toLowerCase();
  $("results-empty").hidden = list.length > 0;
  $("results-empty").textContent = found.length
    ? tr("noHitsMode").replace("{m}", label)
    : tr("noHits");
  $("results").innerHTML = list.slice(0, 30).map(s => {
    const lines = [...new Set(s.routes.filter(r => r.mode === mode).map(r => r.shortName))].sort(byLine);
    const heads = [...new Set((s.patterns || []).map(p => p.headsign).filter(Boolean))].slice(0, 3);
    return `<li><button class="item m-${esc(s.vehicleMode)}" data-go="${esc(stopHash(s.gtfsId))}">
      <div class="name">${esc(s.name)}</div>
      <div class="meta">${esc([s.code, s.platformCode ? tr("platform") + " " + s.platformCode : "", s._dist != null ? s._dist + " m" : ""].filter(Boolean).join(", "))}</div>
      <div class="next">${lines.slice(0, 14).map(l => `<span class="ln">${esc(l)}</span>`).join("")}</div>
      ${heads.length ? `<div class="meta">${tr("toward")} ${esc(heads.join(", "))}</div>` : ""}
    </button></li>`;
  }).join("");
}
let qTimer;
$("q").addEventListener("input", () => {
  clearTimeout(qTimer);
  const q = $("q").value.trim();
  if(q.length < 2){ found = null; renderResults(); return; }
  qTimer = setTimeout(async () => {
    try{
      const d = await gql(`query($q:String!){ stops(name:$q){ ${STOP_FIELDS()} } }`, {q});
      if($("q").value.trim() === q){ found = d.stops || []; renderResults(); }
    }catch(e){}
  }, 300);
});
$("near").onclick = () => {
  if(!navigator.geolocation){ showErr(tr("errNoGeo")); return; }
  navigator.geolocation.getCurrentPosition(async pos => {
    try{
      const d = await gql(`query($lat:Float!,$lon:Float!){ stopsByRadius(lat:$lat, lon:$lon, radius:700, first:120){ edges{ node{ distance stop{ ${STOP_FIELDS()} } } } } }`,
        {lat: pos.coords.latitude, lon: pos.coords.longitude});
      found = d.stopsByRadius.edges.map(e => Object.assign(e.node.stop, {_dist: e.node.distance})); renderResults();
    }catch(e){}
  }, () => showErr(tr("errGeo")), {timeout: 8000});
};

/* ---------- Pysäkkinäkymä ---------- */
let cur = null;
function openStop(id, lines){
  cur = {id, lines, stop: null, times: []};
  $("v-stop").hidden = false;
  $("s-name").firstChild.textContent = tr("loading"); $("s-meta").textContent = "";
  $("board").innerHTML = ""; $("chips").innerHTML = ""; $("s-note").textContent = "";
  renderFavBtn();
  const load = async () => {
    const mine = cur;
    try{
      const d = await gql(`query($id:String!){ stop(id:$id){ gtfsId name${LA()} code platformCode vehicleMode lat lon routes{ shortName mode } ${TIMES()} } }`, {id});
      if(cur !== mine) return;
      if(!d.stop){ $("s-name").firstChild.textContent = tr("notFound"); return; }
      const first = !cur.stop;
      cur.stop = d.stop; cur.times = d.stop.stoptimesWithoutPatterns || [];
      if(first){ renderStopHead(); startLive(); }
      renderBoard(); syncLive();
    }catch(e){}
  };
  load(); every(load, CONFIG.POLL_MS); every(renderBoard, 5000);
}
function renderStopHead(){
  const s = cur.stop;
  $("s-name").firstChild.textContent = s.name;
  $("s-meta").textContent = [s.code, s.platformCode ? tr("platform") + " " + s.platformCode : ""].filter(Boolean).join(", ");
  $("v-stop").className = "m-" + (s.vehicleMode || "TRAM");
  document.title = s.name + " – Pysäkkitaulut";
  renderChips(); renderFavBtn();
}
function renderChips(){
  const all = [...new Set(cur.stop.routes.map(r => r.shortName))].sort(byLine);
  $("chips").innerHTML = all.length < 2 ? "" : all.map(l =>
    `<button class="chip" data-line="${esc(l)}" aria-pressed="${cur.lines.includes(l)}">${esc(l)}</button>`).join("");
}
$("chips").addEventListener("click", e => {
  const b = e.target.closest("[data-line]"); if(!b) return;
  const l = b.dataset.line;
  cur.lines = cur.lines.includes(l) ? cur.lines.filter(x => x !== l) : [...cur.lines, l].sort(byLine);
  history.replaceState(null, "", "#" + stopHash(cur.id, cur.lines));
  renderChips(); renderFavBtn(); renderBoard(); syncLive();
});
function renderBoard(){
  if(!cur || !cur.stop) return;
  const rows = upcoming(cur.times, cur.lines).slice(0, 7);
  $("board").innerHTML = rows.length ? rows.map(x =>
    `<div class="row${x.t.realtime ? "" : " sched"}${x.e.cancel ? " cancel" : ""}">
      <span class="ln m-${esc(x.t.trip.route.mode)}">${esc(x.t.trip.route.shortName)}</span>
      <span class="to">${esc(x.t.headsign || "")}</span>
      <span class="min">${x.e.html}</span>
    </div>`).join("") : '<p class="empty" style="padding:20px 14px;margin:0">' + tr("noUpcoming") + '</p>';
  $("s-note").textContent = rows.some(x => !x.t.realtime && !x.e.cancel) ? tr("schedNote") : "";
}
function renderFavBtn(){
  const on = !!(cur && favs.some(f => favKey(f) === favKey(cur)));
  $("fav").setAttribute("aria-pressed", on);
  $("fav").textContent = on ? tr("favOn") : tr("favSave");
}
$("fav").onclick = () => {
  if(!cur || !cur.stop) return;
  favs = favs.some(f => favKey(f) === favKey(cur))
    ? favs.filter(f => favKey(f) !== favKey(cur))
    : [...favs, {id: cur.id, name: cur.stop.name, code: cur.stop.code, mode: cur.stop.vehicleMode, lines: cur.lines}];
  store.set("ratikka.favs", favs); renderFavBtn();
};
$("share").onclick = async () => {
  const url = location.origin + location.pathname + "#" + stopHash(cur.id, cur.lines);
  try{
    if(navigator.share) await navigator.share({title: cur.stop ? cur.stop.name : "Pysäkkitaulut", url});
    else{ await navigator.clipboard.writeText(url); $("share").textContent = tr("copied"); setTimeout(() => $("share").textContent = tr("share"), 2000); }
  }catch(e){}
};

/* ---------- Live-sijainnit (HSL HFP, MQTT) ---------- */
let map = null, mq = null, subs = new Set(), vehicles = {}, live = {routes: new Set(), names: {}};
function startLive(){
  if(!window.L){ $("map").hidden = true; return; }
  $("map").hidden = false;
  map = L.map("map", {zoomControl: false}).setView([cur.stop.lat, cur.stop.lon], 14);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 18, attribution: "© OpenStreetMap"}).addTo(map);
  L.circleMarker([cur.stop.lat, cur.stop.lon], {radius: 9, color: "#13201A", weight: 3, fillColor: "#FFD23F", fillOpacity: 1}).addTo(map);
  if(!window.mqtt) return;
  try{
    mq = mqtt.connect(CONFIG.HFP_URL, {reconnectPeriod: 5000});
    mq.on("connect", () => { subs.forEach(t => mq.subscribe(t)); });
    mq.on("message", (topic, payload) => {
      let vp; try{ vp = JSON.parse(payload.toString()).VP; }catch(e){ return; }
      if(!vp || vp.lat == null || vp.long == null || !map) return;
      const id = vp.oper + "/" + vp.veh;
      const rid = String(vp.route || topic.split("/")[9]);
      if(!live.routes.has(rid)){ dropVehicle(id); return; }
      let v = vehicles[id];
      if(!v){
        v = vehicles[id] = {m: L.marker([vp.lat, vp.long], {interactive: false,
          icon: L.divIcon({className: "", iconSize: [30, 30], html: `<div class="veh">${esc(live.names[rid] || vp.desi)}</div>`})}).addTo(map), route: rid};
      }else v.m.setLatLng([vp.lat, vp.long]);
      v.seen = Date.now();
    });
    every(() => { for(const id in vehicles) if(Date.now() - vehicles[id].seen > 30000) dropVehicle(id); }, 10000);
  }catch(e){}
}
function dropVehicle(id){ if(vehicles[id]){ vehicles[id].m.remove(); delete vehicles[id]; } }
function syncLive(){
  if(!mq || !cur) return;
  // Tilataan vain ne linjat ja suunnat, jotka oikeasti kulkevat tämän pysäkin kautta.
  const want = new Set(), routes = new Set(), names = {};
  cur.times.forEach(t => {
    const r = t.trip.route;
    if(cur.lines.length && !cur.lines.includes(r.shortName)) return;
    const dir = parseInt(t.trip.directionId, 10);
    if(isNaN(dir)) return;
    const rid = r.gtfsId.split(":")[1];
    routes.add(rid); names[rid] = r.shortName;
    want.add(`/hfp/v2/journey/ongoing/vp/+/+/+/${rid}/${dir + 1}/#`);
  });
  live = {routes, names};
  subs.forEach(t => { if(!want.has(t)){ mq.unsubscribe(t); subs.delete(t); } });
  want.forEach(t => { if(!subs.has(t)){ subs.add(t); if(mq.connected) mq.subscribe(t); } });
  for(const id in vehicles) if(!routes.has(vehicles[id].route)) dropVehicle(id);
}
function stopLive(){
  if(mq){ try{ mq.end(true); }catch(e){} mq = null; }
  subs = new Set(); vehicles = {}; live = {routes: new Set(), names: {}};
  if(map){ map.remove(); map = null; }
  document.title = "Pysäkkitaulut";
}

applyLang();
route();
</script>
